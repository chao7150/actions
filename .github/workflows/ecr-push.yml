name: ECR Push

on:
  workflow_call:
    inputs:
      aws_region:
        description: 'AWS Region'
        required: true
        type: string
      ecr_repository:
        description: 'ECR Repository name'
        required: true
        type: string
      docker_context:
        description: 'Docker build context path'
        required: false
        type: string
        default: '.'
      docker_file:
        description: 'Dockerfile path'
        required: false
        type: string
    secrets:
      aws_role_to_assume:
        description: 'AWS IAM Role ARN to assume'
        required: true

jobs:
  ecr-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      image_tag: ${{ env.DATE }}_${{ github.sha }}

    steps:
      - name: Mask Role ARN
        run: echo "::add-mask::${{ secrets.aws_role_to_assume }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.docker_file }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ env.DATE }}_${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:latest
