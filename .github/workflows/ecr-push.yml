name: ECR Push

on:
  workflow_call:
    inputs:
      aws_region:
        description: 'AWS Region'
        required: true
        type: string
      ecr_repository:
        description: 'ECR Repository name'
        required: true
        type: string
      docker_context:
        description: 'Docker build context path'
        required: false
        type: string
        default: '.'
      docker_file:
        description: 'Dockerfile path'
        required: false
        type: string
      dispatch_enabled:
        description: 'Enable repository dispatch for PR creation'
        required: false
        type: boolean
        default: true
      dispatch_repository:
        description: 'Target repository for dispatch (owner/repo)'
        required: false
        type: string
        default: 'chao7150/sakura2-iac'
    secrets:
      aws_role_to_assume:
        description: 'AWS IAM Role ARN to assume'
        required: true
      dispatch_token:
        description: 'PAT for repository dispatch'
        required: false
    outputs:
      registry:
        description: 'ECR registry URL'
        value: ${{ jobs.ecr-push.outputs.registry }}
      image_tag:
        description: 'Image tag (date_sha)'
        value: ${{ jobs.ecr-push.outputs.image_tag }}
      digest:
        description: 'Image digest'
        value: ${{ jobs.ecr-push.outputs.digest }}

jobs:
  ecr-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      image_tag: ${{ env.DATE }}_${{ github.sha }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Mask Role ARN
        run: echo "::add-mask::${{ secrets.aws_role_to_assume }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.docker_file }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ env.DATE }}_${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:latest

      - name: Dispatch update event
        if: inputs.dispatch_enabled == true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.dispatch_token }}
          repository: ${{ inputs.dispatch_repository }}
          event-type: ecr-image-pushed
          client-payload: |
            {
              "registry": "${{ steps.login-ecr.outputs.registry }}",
              "ecr_repository": "${{ inputs.ecr_repository }}",
              "tag": "${{ env.DATE }}_${{ github.sha }}",
              "digest": "${{ steps.build.outputs.digest }}",
              "source_repo": "${{ github.repository }}"
            }
